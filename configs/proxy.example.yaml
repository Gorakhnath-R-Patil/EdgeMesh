# Example configuration for edgemesh-proxy.
#
# Copy to a local path and pass it via `-config`, e.g.:
#   edgemesh-proxy -config configs/proxy.example.yaml
#
# Any field left unset falls back to the binary's built-in default, and
# any field can be overridden at runtime with an EDGEMESH_* environment
# variable (see internal/config).

node:
  id: proxy-1
  zone: local
  region: local

logging:
  level: info   # debug | info | warn | error
  format: text  # text | json

server:
  listenAddress: 0.0.0.0:8080

# upstream.address is required — edgemesh-proxy forwards every request
# to this single backend. Multi-endpoint selection (service registry +
# routing strategies) arrives in a later development phase.
upstream:
  address: http://127.0.0.1:9000
  # Three independent timeout phases (see internal/proxy's package doc
  # for how they compose):
  dialTimeout: 5s              # connection timeout: establishing the TCP connection
  responseHeaderTimeout: 10s    # upstream timeout: waiting for the backend to start responding
  requestTimeout: 15s           # request timeout: the entire exchange, start to finish
  idleConnTimeout: 90s
  maxIdleConns: 100
  maxIdleConnsPerHost: 10
